name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # Αλλαγές μόνο σε τεκμηρίωση δεν παράγουν νέο release
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level env, ώστε τα steps να μπορούν να ελέγξουν αν υπάρχει keystore
      # (το `secrets` context ΔΕΝ είναι διαθέσιμο σε step-level `if`).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            NAME="0.2.${GITHUB_RUN_NUMBER}"
            TAG="v0.2.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # Πριν από το build: αν σπάσουν τα σύνολα ή η ανάγνωση, δεν βγαίνει apk
      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build release APK + AAB
        run: |
          gradle --no-daemon assembleRelease bundleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Prosfores-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Prosfores-${{ steps.version.outputs.tag }}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prosfores-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED_NOTE="⚠️ Debug-signed build (δεν έχουν οριστεί ακόμη τα signing secrets)."
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            SIGNED_NOTE="✅ Release-signed με το production keystore."
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* \
            --title "Προσφορές ${{ steps.version.outputs.tag }}" \
            --notes "$(printf '%s\n\n%s\n\n%s' "Αυτόματο build από commit ${GITHUB_SHA:0:7}." "$SIGNED_NOTE" "$(git log -1 --pretty=%B)")" \
            || gh release upload "${{ steps.version.outputs.tag }}" dist/* --clobber

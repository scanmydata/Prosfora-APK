name: Fix payroll AM IKA regex

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-payroll-regex.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix escaped payroll regexes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/gr/prosfora/app/debt/DebtImporter.kt')
          s = p.read_text(encoding='utf-8')
          old1 = r'Regex("""^\\s*\\d{1,3}\\s+([0-9]{2,6})\\s+(.+)$""")'
          new1 = r'Regex("""^\s*\d{1,3}\s+([0-9]{2,6})\s+(.+)$""")'
          old2 = r'Regex("""(?<!\\d)\\d{7,12}(?!\\d)""")'
          new2 = r'Regex("""(?<!\d)\d{7,12}(?!\d)""")'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected broken payroll regexes were not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -n 'val header\|val longNumber' app/src/main/java/gr/prosfora/app/debt/DebtImporter.kt

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/gr/prosfora/app/debt/DebtImporter.kt
          git commit -m 'fix payroll AM IKA extraction [skip payroll regex]'
          git push

      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-payroll-regex.yml
          git add .github/workflows/fix-payroll-regex.yml
          git commit -m 'remove one-shot payroll regex workflow [skip payroll regex]'
          git push

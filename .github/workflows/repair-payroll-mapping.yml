name: Repair payroll mapping
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/gr/prosfora/app/debt/DebtParser.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'private class Person(val code: String, val name: String) {',
              'private class Person(val code: String, val name: String, val amIka: String) {'
          )
          old = 'people += Person(head.groupValues[2], nameOf(printedName ?: head.groupValues[3]))'
          new = '''val amIka = Regex("""(?<!\\d)(\\d{9,10})(?!\\d)""").find(line)?.groupValues?.getOrNull(1).orEmpty()
                people += Person(head.groupValues[2], nameOf(printedName ?: head.groupValues[3]), amIka)'''
          if old not in s:
              raise SystemExit('Person construction not found')
          s = s.replace(old, new, 1)
          old = '        driveFileId = driveFileId,\n    )'
          new = '        driveFileId = driveFileId,\n        amIka = amIka,\n    )'
          if old not in s:
              raise SystemExit('Debt constructor tail not found')
          s = s.replace(old, new, 1)
          old = '        driveFileId = driveFileId,\n    )\n\n    /** «Τακτικές αποδοχές'
          new = '        driveFileId = driveFileId,\n        amIka = person.amIka,\n    )\n\n    /** «Τακτικές αποδοχές'
          if old not in s:
              raise SystemExit('Payroll row tail not found')
          s = s.replace(old, new, 1)
          old = '        id = DebtEntity.idFor(kind, period.year, period.month, reference, personName),'
          new = '''        id = DebtEntity.idFor(
            kind,
            period.year,
            period.month,
            if (amIka.isNotBlank() && personName.isNotBlank()) "$reference|$amIka" else reference,
            personName,
        ),'''
          if old not in s:
              raise SystemExit('Debt id line not found')
          s = s.replace(old, new, 1)
          old = '        dueDay: Long? = null,\n        fileName: String,'
          new = '        dueDay: Long? = null,\n        amIka: String = "",\n        fileName: String,'
          if old not in s:
              raise SystemExit('Debt signature not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          d = Path('app/src/main/java/gr/prosfora/app/data/db/Daos.kt')
          s = d.read_text(encoding='utf-8')
          old = '    suspend fun importedFileIds(): List<String>\n'
          new = old + '''    @Query("SELECT DISTINCT driveFileId FROM debts WHERE driveFileId != '' AND (kind = 'PAYROLL' OR kind = 'PAYROLL_BONUS') AND amIka = ''")
    suspend fun legacyPayrollFileIdsMissingIka(): List<String>
    @Query("DELETE FROM debts WHERE driveFileId IN (:fileIds) AND (kind = 'PAYROLL' OR kind = 'PAYROLL_BONUS') AND amIka = ''")
    suspend fun deleteLegacyPayrollRows(fileIds: List<String>)
'''
          if old not in s:
              raise SystemExit('DAO marker not found')
          d.write_text(s.replace(old, new, 1), encoding='utf-8')

          r = Path('app/src/main/java/gr/prosfora/app/debt/DebtRepository.kt')
          s = r.read_text(encoding='utf-8')
          marker = '    fun observeEmployees(): Flow<List<EmployeeEntity>> = employees.observeAll()\n'
          insert = marker + '''\n    suspend fun legacyPayrollFileIdsMissingIka(): List<String> = debts.legacyPayrollFileIdsMissingIka()
    suspend fun deleteLegacyPayrollRows(fileIds: Collection<String>) {
        if (fileIds.isNotEmpty()) debts.deleteLegacyPayrollRows(fileIds.toList())
    }
'''
          if marker not in s:
              raise SystemExit('Repository marker not found')
          r.write_text(s.replace(marker, insert, 1), encoding='utf-8')

          q = Path('app/src/main/java/gr/prosfora/app/sync/DriveSyncCoordinator.kt')
          s = q.read_text(encoding='utf-8')
          old = '''        val alreadyImported =
            repository.importedFileIds() +
                PendingDebtNotificationStore.fileIds(app) +
                settings.knownDriveIds
'''
          new = '''        val legacyPayrollFileIds = repository.legacyPayrollFileIdsMissingIka().toSet()
        if (legacyPayrollFileIds.isNotEmpty()) {
            repository.deleteLegacyPayrollRows(legacyPayrollFileIds)
            settings.forgetDriveFiles(legacyPayrollFileIds)
            DebugLog.log("employees", "legacy payroll repair queued · files=${legacyPayrollFileIds.size}")
        }
        val alreadyImported =
            repository.importedFileIds() +
                PendingDebtNotificationStore.fileIds(app) +
                (settings.knownDriveIds - legacyPayrollFileIds)
'''
          if old not in s:
              raise SystemExit('Sync block not found')
          q.write_text(s.replace(old, new, 1), encoding='utf-8')

          u = Path('app/src/main/java/gr/prosfora/app/ui/employees/EmployeesScreen.kt')
          s = u.read_text(encoding='utf-8')
          if 'import gr.prosfora.app.sync.PayrollInsuranceDaysStore' not in s:
              s = s.replace('import gr.prosfora.app.sync.SheetSync\n', 'import gr.prosfora.app.sync.SheetSync\nimport gr.prosfora.app.sync.PayrollInsuranceDaysStore\n', 1)
          old = '                        Text("Συνολικά πληρωτέα: ${rows.sumOf { it.amount }.asMoney()}", style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.Bold)\n'
          new = old + '                        Text("Σύνολο ενσήμων: ${PayrollInsuranceDaysStore.total(context, employee.amIka)}", style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold)\n'
          if old in s:
              s = s.replace(old, new, 1)
          old = '                        Text("ΑΜ ΙΚΑ ${employee.amIka}", style = MaterialTheme.typography.labelSmall, color = BrandGreen)\n'
          new = old + '                        Text("Σύνολο ενσήμων: ${PayrollInsuranceDaysStore.total(context, employee.amIka)}", style = MaterialTheme.typography.labelSmall, color = BrandGreen)\n'
          if old in s:
              s = s.replace(old, new, 1)
          u.write_text(s, encoding='utf-8')
          PY
      - name: Build
        run: ./gradlew --no-daemon :app:compileReleaseKotlin
      - name: Commit and remove repair workflows
        shell: bash
        run: |
          git config user.name scanmydata
          git config user.email scanmydata@hotmail.com
          git add app/src/main/java/gr/prosfora/app/debt/DebtParser.kt app/src/main/java/gr/prosfora/app/data/db/Daos.kt app/src/main/java/gr/prosfora/app/debt/DebtRepository.kt app/src/main/java/gr/prosfora/app/sync/DriveSyncCoordinator.kt app/src/main/java/gr/prosfora/app/ui/employees/EmployeesScreen.kt
          git diff --cached --quiet || git commit -m "Fix payroll AM IKA mapping and insurance days"
          git push origin main
          git rm .github/workflows/repair-payroll-mapping.yml .github/workflows/fix-payroll-employee-mapping.yml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Remove temporary payroll repair workflows"
          git push origin main

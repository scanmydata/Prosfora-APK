name: Repair payroll employee mapping

on:
  push:
    paths:
      - '.github/workflows/fix-payroll-employee-mapping.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch payroll parser and legacy rescan
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/gr/prosfora/app/debt/DebtParser.kt')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'private class Person(val code: String, val name: String) {\n        val details = mutableListOf<Detail>()\n        var payable: Double? = null\n    }',
              'private class Person(val code: String, val name: String, val amIka: String) {\n        val details = mutableListOf<Detail>()\n        var payable: Double? = null\n    }'
          )

          old = '''            val head = header.find(line)
            if (head != null && head.groupValues[3].firstOrNull()?.isLetter() == true) {
                val printedName = printed.getOrNull(index)
                    ?.takeIf { it.length == line.length }
                    ?.slice(head.groups[3]!!.range)
                    ?.takeIf { it.isNotBlank() }
                people += Person(head.groupValues[2], nameOf(printedName ?: head.groupValues[3]))
                return@forEachIndexed
            }'''
          new = '''            val head = header.find(line)
            if (head != null && head.groupValues[3].firstOrNull()?.isLetter() == true) {
                val printedName = printed.getOrNull(index)
                    ?.takeIf { it.length == line.length }
                    ?.slice(head.groups[3]!!.range)
                    ?.takeIf { it.isNotBlank() }
                val amIka = Regex("""(?<!\\d)(\\d{9,10})(?!\\d)""")
                    .find(line)?.groupValues?.getOrNull(1)
                    ?.let(EmployeeEntity::normalizeIka)
                    .orEmpty()
                people += Person(
                    head.groupValues[2],
                    nameOf(printedName ?: head.groupValues[3]),
                    amIka,
                )
                return@forEachIndexed
            }'''
          if old not in s:
              raise SystemExit('DebtParser readPeople block not found')
          s = s.replace(old, new)

          old = '''        amount = amount,
        reference = reference,
        description = description,
        personName = personName,
        personCode = personCode,
        source = fileName,
        driveFileId = driveFileId,
    )'''
          new = '''        amount = amount,
        reference = reference,
        description = description,
        personName = personName,
        personCode = personCode,
        amIka = amIka,
        source = fileName,
        driveFileId = driveFileId,
    )'''
          if old not in s:
              raise SystemExit('DebtParser debt constructor block not found')
          s = s.replace(old, new, 1)

          old = '''        id = DebtEntity.idFor(kind, period.year, period.month, reference, personName),'''
          new = '''        id = DebtEntity.idFor(
            kind,
            period.year,
            period.month,
            if (amIka.isNotBlank() && personName.isNotBlank()) "$reference|$amIka" else reference,
            personName,
        ),'''
          if old not in s:
              raise SystemExit('DebtParser debt id block not found')
          s = s.replace(old, new, 1)

          old = '''        dueDay: Long? = null,
        fileName: String,
        driveFileId: String,
    ): DebtEntity ='''
          new = '''        dueDay: Long? = null,
        amIka: String = "",
        fileName: String,
        driveFileId: String,
    ): DebtEntity ='''
          if old not in s:
              raise SystemExit('DebtParser debt signature not found')
          s = s.replace(old, new, 1)

          old = '''        description = description,
        reference = "",
        personName = person.name,
        personCode = person.code,
        fileName = fileName,
        driveFileId = driveFileId,
    )'''
          new = '''        description = description,
        reference = "",
        personName = person.name,
        personCode = person.code,
        amIka = person.amIka,
        fileName = fileName,
        driveFileId = driveFileId,
    )'''
          if old not in s:
              raise SystemExit('DebtParser payrollRow block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          dao = Path('app/src/main/java/gr/prosfora/app/data/db/Daos.kt')
          s = dao.read_text(encoding='utf-8')
          old = '''    /** Payroll files imported before AM IKA existed must be scanned again. */
    @Query("SELECT DISTINCT driveFileId FROM debts WHERE driveFileId != '' AND NOT ((kind = 'PAYROLL' OR kind = 'PAYROLL_BONUS') AND amIka = '')")
    suspend fun importedFileIds(): List<String>'''
          new = '''    /** Payroll files imported before AM IKA existed must be scanned again. */
    @Query("SELECT DISTINCT driveFileId FROM debts WHERE driveFileId != '' AND NOT ((kind = 'PAYROLL' OR kind = 'PAYROLL_BONUS') AND amIka = '')")
    suspend fun importedFileIds(): List<String>
    @Query("SELECT DISTINCT driveFileId FROM debts WHERE driveFileId != '' AND (kind = 'PAYROLL' OR kind = 'PAYROLL_BONUS') AND amIka = ''")
    suspend fun legacyPayrollFileIdsMissingIka(): List<String>
    @Query("DELETE FROM debts WHERE driveFileId IN (:fileIds) AND (kind = 'PAYROLL' OR kind = 'PAYROLL_BONUS') AND amIka = ''")
    suspend fun deleteLegacyPayrollRows(fileIds: List<String>)'''
          if old not in s:
              raise SystemExit('Daos importedFileIds block not found')
          dao.write_text(s.replace(old, new), encoding='utf-8')

          repo = Path('app/src/main/java/gr/prosfora/app/debt/DebtRepository.kt')
          s = repo.read_text(encoding='utf-8')
          marker = '    fun observeEmployees(): Flow<List<EmployeeEntity>> = employees.observeAll()\n'
          insert = marker + '''\n    suspend fun legacyPayrollFileIdsMissingIka(): List<String> =\n        debts.legacyPayrollFileIdsMissingIka()\n\n    suspend fun deleteLegacyPayrollRows(fileIds: Collection<String>) {\n        if (fileIds.isEmpty()) return\n        debts.deleteLegacyPayrollRows(fileIds.toList())\n    }\n'''
          if marker not in s:
              raise SystemExit('DebtRepository marker not found')
          repo.write_text(s.replace(marker, insert, 1), encoding='utf-8')

          sync = Path('app/src/main/java/gr/prosfora/app/sync/DriveSyncCoordinator.kt')
          s = sync.read_text(encoding='utf-8')
          old = '''        val alreadyImported =
            repository.importedFileIds() +
                PendingDebtNotificationStore.fileIds(app) +
                settings.knownDriveIds
'''
          new = '''        val legacyPayrollFileIds = repository.legacyPayrollFileIdsMissingIka().toSet()
        if (legacyPayrollFileIds.isNotEmpty()) {
            // Παλιές payroll εγγραφές χωρίς ΑΜ ΙΚΑ είναι μη-κανονικές. Τις αφαιρούμε
            // και ξαναδιαβάζουμε μόνο τα συγκεκριμένα αρχεία ώστε να αποκτήσουν
            // canonical employee identity, χωρίς δεύτερο OCR για τα υπόλοιπα.
            repository.deleteLegacyPayrollRows(legacyPayrollFileIds)
            settings.forgetDriveFiles(legacyPayrollFileIds)
            DebugLog.log(
                "employees",
                "legacy payroll repair queued · files=${legacyPayrollFileIds.size}",
            )
        }

        val alreadyImported =
            repository.importedFileIds() +
                PendingDebtNotificationStore.fileIds(app) +
                (settings.knownDriveIds - legacyPayrollFileIds)
'''
          if old not in s:
              raise SystemExit('DriveSyncCoordinator alreadyImported block not found')
          sync.write_text(s.replace(old, new, 1), encoding='utf-8')

          ui = Path('app/src/main/java/gr/prosfora/app/ui/employees/EmployeesScreen.kt')
          s = ui.read_text(encoding='utf-8')
          imp = 'import gr.prosfora.app.sync.SheetSync\n'
          if 'import gr.prosfora.app.sync.PayrollInsuranceDaysStore\n' not in s:
              s = s.replace(imp, imp + 'import gr.prosfora.app.sync.PayrollInsuranceDaysStore\n', 1)
          old = '                        Text("Συνολικά πληρωτέα: ${rows.sumOf { it.amount }.asMoney()}", style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.Bold)\n'
          new = old + '                        Text("Σύνολο ενσήμων: ${PayrollInsuranceDaysStore.total(context, employee.amIka)}", style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Bold)\n'
          if old not in s:
              raise SystemExit('EmployeesScreen card total block not found')
          s = s.replace(old, new, 1)
          old = '                        Text("ΑΜ ΙΚΑ ${employee.amIka}", style = MaterialTheme.typography.labelSmall, color = BrandGreen)\n'
          new = old + '                        Text("Σύνολο ενσήμων: ${PayrollInsuranceDaysStore.total(context, employee.amIka)}", style = MaterialTheme.typography.labelSmall, color = BrandGreen)\n'
          if old not in s:
              raise SystemExit('EmployeesScreen detail AM IKA block not found')
          s = s.replace(old, new, 1)
          ui.write_text(s, encoding='utf-8')
          PY

      - name: Verify build
        run: ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "scanmydata"
          git config user.email "scanmydata@hotmail.com"
          git add app/src/main/java/gr/prosfora/app/debt/DebtParser.kt \
                  app/src/main/java/gr/prosfora/app/data/db/Daos.kt \
                  app/src/main/java/gr/prosfora/app/debt/DebtRepository.kt \
                  app/src/main/java/gr/prosfora/app/sync/DriveSyncCoordinator.kt \
                  app/src/main/java/gr/prosfora/app/ui/employees/EmployeesScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix payroll AM IKA mapping and show insurance days"
          git push origin main

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-payroll-employee-mapping.yml
          git commit -m "Remove one-shot payroll mapping repair workflow"
          git push origin main
